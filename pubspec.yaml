name: eman_experience
description: "Premium multilingual EMAN beverage manufacturer website."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/brands/valore/
    - assets/brands/friocups/
    - assets/brands/royac/
    - assets/brands/fullfresh/
    - assets/products/valore/
    - assets/products/friocups/
    - assets/products/royac/
    - assets/products/fullfresh/

  fonts:
    - family: DINNextLTArabic
      fonts:
        - asset: assets/fonts/DINNextLTArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/DINNextLTArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/DINNextLTArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/DINNextLTArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/DINNextLTArabic-Heavy.ttf
          weight: 800
        - asset: assets/fonts/DINNextLTArabic-Black.ttf
          weight: 900
