name: eman_experience
description: "Premium multilingual EMAN beverage manufacturer website."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/hero/
    - assets/backgrounds/
    - assets/lifestyle/
    - assets/certificates/
    - assets/brands/valore/
    - assets/brands/friocups/
    - assets/brands/royac/
    - assets/brands/fullfresh/
    - assets/products/valore/
    - assets/products/friocups/
    - assets/products/royac/
    - assets/products/fullfresh/
