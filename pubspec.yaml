name: eman_experience
description: "Eman Experience manufacturing ERP for instant beverages."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.0.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  firebase_storage: ^13.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/hero/
    - assets/backgrounds/
    - assets/lifestyle/
    - assets/certificates/
    - assets/brands/valore/
    - assets/brands/friocups/
    - assets/brands/royac/
    - assets/brands/fullfresh/
    - assets/products/valore/
    - assets/products/friocups/
    - assets/products/royac/
    - assets/products/fullfresh/
